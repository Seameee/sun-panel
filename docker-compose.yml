services:
  sun-panel:
    image: ghcr.io/seameee/sun-panel:v1.3.1-preview.1
    container_name: sun-panel
    environment:
      - SUN_PANEL_INITIAL_PASSWORD
    volumes:
      - sun-panel-conf:/app/conf
      - sun-panel-uploads:/app/uploads
      - sun-panel-database:/app/database
    ports:
      - '127.0.0.1:3002:3002'
    restart: unless-stopped

volumes:
  sun-panel-conf:
  sun-panel-uploads:
  sun-panel-database:
