services:
  sun-panel:
    image: ghcr.io/seameee/sun-panel:latest
    container_name: sun-panel
    user: '10001:10001'
    environment:
      - SUN_PANEL_INITIAL_PASSWORD
      - SUN_PANEL_WEBAUTHN_ORIGIN
    volumes:
      - sun-panel-conf:/app/conf
      - sun-panel-uploads:/app/uploads
      - sun-panel-database:/app/database
    ports:
      - '127.0.0.1:3002:3002'
    restart: unless-stopped

volumes:
  sun-panel-conf:
  sun-panel-uploads:
  sun-panel-database:
