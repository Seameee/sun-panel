name: Publish Docker preview

on:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and set image name
        id: version
        shell: bash
        run: |
          IFS='|' read -r code version <<< "$(cat service/assets/version)"
          [[ "$code" =~ ^[0-9]+$ && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          test "v$version" = "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.version.outputs.image }}:${{ github.ref_name }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Verify fresh container and version
        shell: bash
        env:
          IMAGE: ${{ steps.version.outputs.image }}:${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --detach --name sun-panel-smoke -p 127.0.0.1:13002:3002 "$IMAGE"
          trap 'docker logs sun-panel-smoke; docker rm -f sun-panel-smoke' EXIT
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 1 \
            --request POST http://127.0.0.1:13002/api/about \
            | jq -e --arg version "$VERSION" '.code == 0 and .data.versionName == $version'
          curl --fail --silent --show-error http://127.0.0.1:13002/ > /dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        env:
          IMAGE: ${{ steps.version.outputs.image }}:${{ github.ref_name }}
        run: docker push "$IMAGE"
